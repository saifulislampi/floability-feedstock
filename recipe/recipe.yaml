schema_version: 1

context:
  name: floability
  version: 0.2.0
  python_min: "3.10"

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  url: https://github.com/floability/floability-cli/archive/refs/tags/v0.2.0.tar.gz
  sha256: 0f93305ad445c53db14bfa64a48b0d458b9f7ad4a6e97362c42e86d7e061d8d8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - floability=floability.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.0
    - wheel
    - conda-pack
  run:
    - python >=${{ python_min }}
    - conda-pack
    - pyyaml
    - requests
    - tqdm
    - ndcctools
    - nbformat
    - jupyter_client
    - boto3
    - botocore
    - pelicanfs

tests:
  - python:
      imports:
        - floability
        - yaml
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - floability --help

about:
  summary: Floability CLI for workflow management
  license: GPL-2.0-only
  license_file: COPYING
  homepage: https://floability.github.io/
  repository: https://github.com/floability/floability-cli
  documentation: https://floability.readthedocs.io/

extra:
  recipe-maintainers:
    - saifulislampi
    - btovar
    - dthain
